.ikon {

}

/* Toolbar */
.toolbar {
    display: flex;
    gap: 12px;
    padding: 16px 24px;
}

.toolbar input {
    flex: 1;
    padding: 11px 14px;

.toolbar select {

    border-radius: 8px;

/* Isi */
.isi {
    display: flex;
    border-top: 1px solid #ccc;
}

.sidebar {
    width: 190px;
    padding: 18px 16px;
    border-right: 1px solid #ccc;
}

.side-item {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
}

.side-ikon {
    width: 16px;
    height: 16px;
    background: #bbb;
    border-radius: 3px;
    flex-shrink: 0;
}

.bar {
    height: 10px;
    background: #ddd;
    border-radius: 4px;
}

.konten {
    flex: 1;
    padding: 20px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
}

.kartu {
    border: 1px solid #ccc;
    border-radius: 8px;
    padding: 10px;
}

.gambar {
    height: 90px;
    background: #e5e5e5;
    border-radius: 6px;
    margin-bottom: 14px;
}

.kartu .bar {
    margin-bottom: 8px;
}

.w60 { width: 60%; }
.w40 { width: 40%; }
.w50 { width: 50%; }

/* Tombol Detail */
.kartu .btn-detail {
    display: block;
    width: 100%;
    margin-top: 8px;
    padding: 7px;
    border: 1px solid #ccc;
    background: #f2f2f2;
    border-radius: 5px;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    color: #222;
    font-size: 13px;
    transition: 0.2s;
}

.kartu .btn-detail:hover {
    background: #ddd;
}

/* Pagination */
.paging {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin-top: 24px;
}

.paging a {
    padding: 6px 11px;
    border: 1px solid #ccc;
    border-radius: 50%;
    text-decoration: none;
    color: #333;
    font-size: 13px;
}

.paging a.aktif {
    border-color: #000;
    font-weight: bold;
}

/* Responsive */
@media (max-width: 720px) {
    .isi {
        flex-direction: column;
    }

    .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid #ccc;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    .toolbar {
        flex-wrap: wrap;
    }
}
</style>
</head>
